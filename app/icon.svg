<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e0a8" />
      <stop offset="50%" stop-color="#c59b4b" />
      <stop offset="100%" stop-color="#9e7428" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#09251b" />
  <!-- Golden Sun -->
